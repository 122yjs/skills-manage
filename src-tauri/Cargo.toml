[package]
name = "skills-manage"
version = "0.12.3"
description = "AI Agent Skills Manager"
authors = ["iamzhihuix"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "skills_manage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = { version = "1", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.9"
toml_edit = "0.25"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["sync", "process", "time"] }
sha2 = "0.10"
glob = "0.3"
json5 = "0.4"
regex = "1"
keyring = "4"

[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1"

[features]
# 켜면 개발자 PC의 `gh`와 OS 키체인을 쓰지 않는다. `cfg(test)`가 꺼진 통합 테스트용이다.
test-isolation = []

[dev-dependencies]
# 자기 자신을 개발 의존성으로 넣어 `cargo test`가 통합 테스트에 test-isolation을 자동으로 켜게 한다.
skills-manage = { path = ".", features = ["test-isolation"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
