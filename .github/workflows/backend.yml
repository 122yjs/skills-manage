name: Backend

# Rust 코드(src-tauri)가 바뀐 경우에만 Mac 서버에서 검사한다.
# 화면만 바꾼 PR은 Mac 서버를 기다리지 않는다.
on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main, master]
    paths:
      - "src-tauri/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend
    runs-on: macos-15-intel  # Apple 칩 Mac 서버 부족으로 Intel Mac 서버에서 검사한다
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Test (unit and integration)
        working-directory: src-tauri
        run: cargo test

      - name: Clippy (including tests)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
